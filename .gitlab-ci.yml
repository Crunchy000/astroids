# GitLab Pages: the browser game, the match videos and the docs, built by tools/build_site.py.
# Runs on the default branch. The site is about 160 MB, well under GitLab.com's 1 GB artifact limit.
pages:
  image: python:3.12-slim
  script:
    - pip install --quiet markdown
    - python tools/build_site.py --out public --source-url "$CI_PROJECT_URL/-/blob/$CI_COMMIT_REF_NAME/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
