[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroids-gym"
version = "0.1.0"
description = "Gymnasium / PettingZoo environments for a 5v5 Asteroids-style ship battle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=0.29", "numpy>=1.24"]

[project.optional-dependencies]
render = ["pygame>=2.5"]
fast = ["numba>=0.60"]
video = ["pygame>=2.5", "imageio[ffmpeg]>=2.30"]
multiagent = ["pettingzoo>=1.24"]
competition = ["websockets>=12"]
train = ["stable-baselines3>=2.3", "torch", "tensorboard", "matplotlib", "numba>=0.60"]
dev = ["pytest", "pygame>=2.5", "pettingzoo>=1.24", "numba>=0.60", "websockets>=12"]

[tool.setuptools]
packages = ["astroids_gym", "astroids_gym.competition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
