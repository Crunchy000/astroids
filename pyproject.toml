[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroids-gym"
version = "0.1.0"
description = "Gymnasium / PettingZoo environments for a 5v5 Asteroids-style ship battle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=0.29", "numpy>=1.24"]

[project.optional-dependencies]
render = ["pygame>=2.5"]
multiagent = ["pettingzoo>=1.24"]
train = ["stable-baselines3>=2.3", "torch", "tensorboard"]
dev = ["pytest", "pygame>=2.5", "pettingzoo>=1.24"]

[tool.setuptools]
packages = ["astroids_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
