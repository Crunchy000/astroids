<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroids 5v5 Agents</title>
<meta name="description" content="Training results and videos of PPO agents in the 5v5 Asteroids battle.">
<style>
  :root {
    --bg: #05060a;
    --panel: #0d0f16;
    --line: #1d212c;
    --text: #e6e7ea;
    --text-2: #9aa0ac;
    --blue: #4cc9f0;
    --red: #ff7b54;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--blue); }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px 24px;
           align-items: baseline; justify-content: space-between; }
  h1 { font: 700 22px/1.2 var(--mono); margin: 0; letter-spacing: 0.02em; }
  h1 .b { color: var(--blue); } h1 .r { color: var(--red); }
  nav { font: 14px var(--mono); display: flex; gap: 18px; }
  section { padding: 24px 0 40px; border-top: 1px solid var(--line); margin-top: 16px; }
  h2 { font: 700 18px/1.3 var(--mono); margin: 0 0 6px; }
  .summary { color: var(--text-2); max-width: 70ch; margin: 0 0 20px; }
  .table-wrap { overflow-x: auto; margin: 0 0 24px; }
  table { border-collapse: collapse; font: 14px var(--mono); min-width: 520px; }
  th, td { padding: 8px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 600; }
  tr.hl td { color: var(--text); font-weight: 700; }
  tr.hl td:first-child { color: var(--blue); }
  tbody tr:not(.hl) td { color: var(--text-2); }
  figure { margin: 0; }
  .chart { background: #fcfcfb; border-radius: 8px; padding: 8px; margin: 0 0 28px; max-width: 760px; }
  .chart img { width: 100%; height: auto; display: block; }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .clip video { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; }
  .clip figcaption { padding: 10px 14px 12px; }
  .clip .t { font: 700 14px var(--mono); }
  .clip .n { color: var(--text-2); font-size: 14px; }
  .pending { color: var(--text-2); font-style: italic; }
  #error { color: var(--red); }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; color: var(--text-2); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1><span class="b">BLUE</span> vs <span class="r">RED</span>: trained agents</h1>
  <nav><a href="./">Play the live battle</a><a href="https://github.com/Crunchy000/astorids">Source</a></nav>
</header>
<main id="main"><p class="pending">Loading results…</p></main>
<footer>Videos are 1280×720, 30 fps. Agents are trained with PPO in the Python port of this game (<code>astroids_gym</code>).</footer>

<script>
(async () => {
  const main = document.getElementById('main');
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };

  let data;
  try {
    const res = await fetch('results/videos.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    main.replaceChildren(el('p', { id: 'error' },
      'Could not load results/videos.json. Open this page from the website (or a local web server), not as a file.'));
    return;
  }

  main.replaceChildren(...data.sections.map(s => {
    const sec = el('section', { id: s.id }, el('h2', {}, s.title));
    if (s.summary) sec.append(el('p', { class: 'summary' }, s.summary));
    if (s.pending) sec.append(el('p', { class: 'pending' }, s.pending));
    if (s.table) {
      const head = el('tr', {}, ...s.table.columns.map(c => el('th', { scope: 'col' }, c)));
      const rows = s.table.rows.map((r, i) =>
        el('tr', i === s.table.highlight ? { class: 'hl' } : {}, ...r.map(c => el('td', {}, c))));
      sec.append(el('div', { class: 'table-wrap' },
        el('table', {}, el('thead', {}, head), el('tbody', {}, ...rows))));
    }
    if (s.chart) {
      sec.append(el('figure', { class: 'chart' },
        el('img', { src: s.chart.src, alt: s.chart.alt || '', loading: 'lazy' })));
    }
    if (s.videos && s.videos.length) {
      sec.append(el('div', { class: 'grid' }, ...s.videos.map(v =>
        el('figure', { class: 'clip' },
          el('video', { src: v.src, controls: '', preload: 'none', playsinline: '', ...(v.poster ? { poster: v.poster } : {}) }),
          el('figcaption', {}, el('div', { class: 't' }, v.title), v.note ? el('div', { class: 'n' }, v.note) : null)))));
    }
    return sec;
  }));
})();
</script>
</body>
</html>
