name: Evaluate competition entry

# A maintainer adds the "evaluate" label to a submission issue (see
# competition/README.md). This builds the entry's Docker image from the
# commit named in the issue, runs it with no internet access, plays it against
# the baseline teams in real time and posts the results on the issue.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: evaluate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event.label.name == 'evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # the entry's build never needs our token
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[competition,fast]"
      - name: Build, run and play the entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          OPENBLAS_NUM_THREADS: "1"
        run: python -m astroids_gym.competition submission --issue-body-env ISSUE_BODY --games 10 --out report.md --results results.jsonl
      - name: Post the results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.existsSync('report.md')
              ? fs.readFileSync('report.md', 'utf8') + `\n[Workflow run](${run})`
              : `### ❌ The evaluation did not finish\n\nSee the [workflow run](${run}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ github.event.issue.number }}
          path: |
            report.md
            results.jsonl
          if-no-files-found: ignore
