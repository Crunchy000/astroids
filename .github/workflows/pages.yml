name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-ccbf1ca0-erm5dw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        # the game, the video gallery and the docs (see tools/build_site.py)
        run: |
          pip install markdown
          python tools/build_site.py --out _site --source-url "https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
